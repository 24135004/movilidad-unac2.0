<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro | Movilidad UNAC</title>
    <style>
        :root { --gold: #d4af37; --bg: #050505; }
        body { 
            background: var(--bg); color: #e0e0e0; font-family: 'Inter', sans-serif; 
            display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;
            overflow: hidden; user-select: none; /* Evita selección de texto */
        }
        
        /* Estilo del contador profesional */
        #countdown { text-align: center; animation: fadeIn 1s; }
        #timer { font-size: 4rem; font-weight: 200; color: var(--gold); letter-spacing: 8px; font-variant-numeric: tabular-nums; }
        
        /* Tarjeta con efecto glassmorphism */
        .card { 
            display: none; background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3); padding: 40px; border-radius: 20px;
            width: 90%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: var(--gold); margin-bottom: 30px; letter-spacing: 2px; text-transform: uppercase; font-size: 1.2rem; }
        .group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.65rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        input, select { 
            width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid #333; 
            color: white; border-radius: 8px; box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--gold); }
        .btn { 
            width: 100%; padding: 15px; background: var(--gold); border: none; border-radius: 8px;
            font-weight: 700; cursor: pointer; color: black; margin-top: 20px; text-transform: uppercase;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body oncontextmenu="return false" ondragstart="return false">

    <div id="countdown">
        <h3 style="color:#666; letter-spacing: 3px;">APERTURA DE REGISTRO</h3>
        <div id="timer">00:00:00</div>
    </div>

    <div class="card" id="form-card">
        <h2>Movilidad Ventanilla</h2>
        <form id="registroForm" autocomplete="off" spellcheck="false">
            <div class="group"><label>Nombres</label><input type="text" name="n_u_1" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" required></div>
            <div class="group"><label>Apellidos</label><input type="text" name="n_u_2" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" required></div>
            <div class="group"><label>Código Estudiantil</label><input type="text" name="n_u_3" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" required></div>
            <div class="group"><label>DNI</label><input type="text" name="n_u_4" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" required></div>
            <div class="group"><label>Facultad</label>
                <select name="facultad" required>
                    <option value="">Seleccione...</option>
                    <option value="FIIS">FIIS</option><option value="FIQ">FIQ</option><option value="FIME">FIME</option>
                </select>
            </div>
            <button type="submit" class="btn">Confirmar Registro</button>
        </form>
    </div>

    <script>
        // Lógica de cuenta regresiva
        function updateTimer() {
            const now = new Date();
            const target = new Date(); target.setHours(12, 53, 0, 0); 
            if (now >= target) {
                document.getElementById('countdown').style.display = 'none';
                document.getElementById('form-card').style.display = 'block';
            } else {
                const diff = target - now;
                const h = Math.floor(diff/3600000).toString().padStart(2,'0');
                const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
                const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `${h}:${m}:${s}`;
            }
        }
        setInterval(updateTimer, 1000);

        // Bloqueo estricto de teclado
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'x')) e.preventDefault();
        });
    </script>
</body>
</html>
