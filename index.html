<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro | Movilidad Ventanilla</title>
    <style>
        :root { --gold: #c5a059; --dark: #121212; }
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        
        /* Cuenta regresiva */
        #timer { font-size: 3rem; font-weight: 300; letter-spacing: 5px; color: var(--gold); }
        
        /* Tarjeta */
        .card { display: none; background: #1a1a1a; border: 1px solid var(--gold); padding: 40px; border-radius: 15px; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: var(--gold); margin-bottom: 25px; text-transform: uppercase; }
        .group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.75rem; color: #aaa; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 5px; box-sizing: border-box; }
        
        .btn { width: 100%; padding: 15px; background: var(--gold); border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: black; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="countdown">
        <h3 style="text-align:center">APERTURA EN</h3>
        <div id="timer">00:00:00</div>
    </div>

    <div class="card" id="form-card">
        <h2>Registro Oficial</h2>
        <form id="registroForm" autocomplete="off">
            <div class="group"><label>Nombres</label><input type="text" name="nombres" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" required></div>
            <div class="group"><label>Apellidos</label><input type="text" name="apellidos" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" required></div>
            <div class="group"><label>Código</label><input type="text" name="codigo" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" required></div>
            <div class="group"><label>DNI</label><input type="text" name="dni" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" required></div>
            <div class="group"><label>Facultad</label>
                <select name="facultad" required>
                    <option value="">Seleccione su facultad</option>
                    <option value="FIIS">FIIS</option><option value="FIQ">FIQ</option><option value="FIME">FIME</option>
                </select>
            </div>
            <button type="submit" class="btn">ENVIAR REGISTRO</button>
        </form>
    </div>

    <script>
        // Lógica de tiempo
        function updateTimer() {
            const now = new Date();
            const target = new Date(); target.setHours(12, 53, 0, 0); // Define tu hora
            if (now >= target) {
                document.getElementById('countdown').style.display = 'none';
                document.getElementById('form-card').style.display = 'block';
            } else {
                const diff = target - now;
                const h = Math.floor(diff/3600000).toString().padStart(2,'0');
                const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
                const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `${h}:${m}:${s}`;
            }
        }
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
