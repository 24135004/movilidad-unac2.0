<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Movilidad UNAC</title>
    <style>
        /* Paleta de colores UNAC */
        :root { 
            --azul-oscuro: #002855; 
            --celeste: #00AEEF; 
            --blanco: #ffffff;
            --gris-fondo: #f0f4f8;
        }

        /* Tipografía más grande y fondo espacial animado */
        body { 
            background: linear-gradient(135deg, var(--azul-oscuro) 0%, #00152b 100%); 
            color: #333; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; padding: 20px;
            overflow-x: hidden; user-select: none; font-size: 18px;
        }

        /* Efecto de partículas espaciales / tecnológicas en el fondo */
        .particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.4), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 80px 130px, rgba(255,255,255,0.4), rgba(0,0,0,0)),
                radial-gradient(3px 3px at 150px 80px, var(--celeste), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 220px 210px, rgba(255,255,255,0.4), rgba(0,0,0,0)),
                radial-gradient(3px 3px at 300px 40px, var(--celeste), rgba(0,0,0,0));
            background-repeat: repeat; background-size: 400px 400px;
            animation: starsAnimation 60s linear infinite;
        }
        @keyframes starsAnimation { from { background-position: 0 0; } to { background-position: -1000px 1000px; } }

        /* Estilo del contador */
        #countdown { text-align: center; color: var(--blanco); z-index: 1; }
        .contador-titulo { font-size: 1.5rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; color: var(--celeste); font-weight: bold; }
        #timer { font-size: 5rem; font-weight: 800; letter-spacing: 5px; text-shadow: 0 0 20px rgba(0, 174, 239, 0.5); }

        /* Contenedor principal del formulario */
        #form-container { display: none; width: 100%; max-width: 600px; z-index: 1; }
        
        /* Cabecera del formulario */
        .form-header {
            background: var(--blanco); border-top: 10px solid var(--celeste);
            padding: 30px; border-radius: 12px; margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center;
        }
        .form-header h2 { margin: 0 0 10px 0; color: var(--azul-oscuro); font-size: 2rem; }
        .form-header p { margin: 0; color: #555; font-size: 1.1rem; }

        /* Tarjetas de preguntas (Estilo Google Forms) */
        .question-card { 
            background: var(--blanco); padding: 25px 30px; border-radius: 12px;
            margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border-left: 5px solid var(--celeste); transition: transform 0.2s;
        }
        .question-card:hover { transform: translateY(-2px); }
        .question-card label { display: block; margin-bottom: 15px; font-size: 1.2rem; font-weight: 600; color: var(--azul-oscuro); }
        
        /* Inputs modernos */
        input, select { 
            width: 100%; padding: 15px; background: var(--gris-fondo); border: 1px solid #ccc; 
            color: #111; border-radius: 8px; box-sizing: border-box; outline: none; transition: 0.3s;
            font-size: 1.1rem; font-family: inherit;
        }
        input:focus, select:focus { border-color: var(--celeste); background: var(--blanco); box-shadow: 0 0 0 3px rgba(0, 174, 239, 0.1); }

        /* Botón tecnológico */
        .btn { 
            width: 100%; padding: 20px; background: linear-gradient(90deg, var(--celeste), var(--azul-oscuro)); 
            border: none; border-radius: 12px; font-size: 1.3rem; font-weight: 700; cursor: pointer; 
            color: var(--blanco); text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 8px 20px rgba(0, 174, 239, 0.4); transition: 0.3s; margin-top: 10px;
        }
        .btn:hover { background: linear-gradient(90deg, var(--azul-oscuro), var(--celeste)); box-shadow: 0 10px 25px rgba(0, 174, 239, 0.6); transform: translateY(-2px); }
    </style>
</head>
<body oncontextmenu="return false" ondragstart="return false">

    <div class="particles"></div>

    <div id="countdown">
        <div class="contador-titulo">🚀 Apertura de Sistema en:</div>
        <div id="timer">00:01:00</div>
    </div>

    <div id="form-container">
        <div class="form-header">
            <h2>🚌 Movilidad UNAC</h2>
            <p>Registro Oficial de Pasajeros - Sede Ventanilla</p>
        </div>

        <form id="registroForm" autocomplete="off" spellcheck="false">
            
            <div class="question-card">
                <label>👤 Nombres Completos:</label>
                <input type="text" name="n_u_1" placeholder="Ej: Juan Pérez" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" required>
            </div>

            <div class="question-card">
                <label>📋 Apellidos Completos:</label>
                <input type="text" name="n_u_2" placeholder="Ej: García López" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" required>
            </div>

            <div class="question-card">
                <label>🎓 Código Estudiantil:</label>
                <input type="text" name="n_u_3" placeholder="Ej: 21200..." autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" required>
            </div>

            <div class="question-card">
                <label>🆔 Documento de Identidad (DNI):</label>
                <input type="text" name="n_u_4" placeholder="Ingresa tus 8 dígitos" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" required>
            </div>

            <div class="question-card">
                <label>🏛️ Facultad a la que perteneces:</label>
                <select name="facultad" required>
                    <option value="">Despliega y selecciona...</option>
                    <option value="FCC">FCC - Facultad de Ciencias Contables</option>
                    <option value="FCA">FCA - Facultad de Ciencias Administrativas</option>
                    <option value="FCE">FCE - Facultad de Ciencias Económicas</option>
                    <option value="FIARN">FIARN - Fac. Ing. Ambiental y de Recursos Naturales</option>
                    <option value="FIQ">FIQ - Facultad de Ingeniería Química</option>
                    <option value="FCS">FCS - Facultad de Ciencias de la Salud</option>
                    <option value="FCED">FCED - Facultad de Ciencias y Educación</option>
                    <option value="FIIS">FIIS - Facultad de Ing. Industrial y de Sistemas</option>
                    <option value="FIME">FIME - Facultad de Ing. Mecánica y de Energía</option>
                    <option value="FIPA">FIPA - Facultad de Ing. Pesquera y de Alimentos</option>
                    <option value="FCNM">FCNM - Facultad de Ciencias Naturales y Matemática</option>
                    <option value="FIEE">FIEE - Facultad de Ing. Eléctrica y Electrónica</option>
                </select>
            </div>

            <button type="submit" class="btn">✨ Confirmar Asiento</button>
        </form>
    </div>

    <script>
        // Lógica del Temporizador
        function updateTimer() {
            const now = new Date();
            const target = new Date(); 
            target.setHours(12, 53, 0, 0); // <-- Ajusta la hora de apertura aquí
            
            if (now >= target) {
                document.getElementById('countdown').style.display = 'none';
                document.getElementById('form-container').style.display = 'block';
            } else {
                const diff = target - now;
                const h = Math.floor(diff/3600000).toString().padStart(2,'0');
                const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
                const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `${h}:${m}:${s}`;
            }
        }
        setInterval(updateTimer, 1000);
        updateTimer(); // Ejecutar inmediatamente para evitar parpadeo inicial

        // Medidas de Seguridad Estrictas
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'x')) e.preventDefault();
        });
        
        // Bloquear pegado mediante mouse
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('paste', e => e.preventDefault());
        });
    </script>
</body>
</html>
